function useWeekNav() {
  const [weekOff, setWeekOff] = useState(0);
  const now = new Date();
  const weekStart = (() => {
    const m = getMondayOf(now);
    m.setDate(m.getDate() + weekOff * 7);
    return m;
  })();
  const weekDays = Array.from({
    length: 7
  }, (_, i) => {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    return {
      date: d,
      key: fmtKey(d.getFullYear(), d.getMonth(), d.getDate())
    };
  });
  const s = weekDays[0].date,
    e = weekDays[6].date,
    sm = MONTHS[s.getMonth()],
    em = MONTHS[e.getMonth()];
  const weekLabel = sm === em ? `${sm} ${s.getDate()}–${e.getDate()}, ${s.getFullYear()}` : `${sm} ${s.getDate()} – ${em} ${e.getDate()}, ${e.getFullYear()}`;
  return {
    weekOff,
    setWeekOff,
    weekDays,
    weekLabel
  };
}
